<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is my First Commit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About Us</a></li>
        <li><a href="#javascript">JavaScript</a></li>
        <li><a href="#contactus">Contact Us</a></li>
    </ul>

    <p>This is a new Repo.</p>
<table>
    <thead>
        <tr>
            <th>Id</th>
            <th>Input First</th>
            <th>Input Second</th>
            <th>Operation</th>
            <th>Output</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>1</td>
            <td id="first"></td>
            <td id="second"></td>
            <td>+</td>
            <td id="output" class="output"></td>
        </tr>
    </tbody>
</table>

<script>
    let a = parseInt(prompt("Enter First Num: "), 10);
    let b = parseInt(prompt("Enter Second Num: "), 10);

    document.getElementById("first").textContent = a;
    document.getElementById("second").textContent = b;
    document.getElementById("output").textContent =
        "Sum is: " + (a + b);
</script>
</body>
</html>
